
version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17

  pre_build:
    commands:
      - echo "Starting build for Employee Management API"
      - java -version
      - mvn -version

  build:
    commands:
      - mvn clean package -DskipTests

  post_build:
    commands:
      - echo "Build completed successfully"
      - ls -lh target/*.jar

artifacts:
  files:
    - target/*.jar
  discard-paths: yes
