
version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17

  pre_build:
    commands:
      - echo "Starting Employee API build"
      - java -version
      - mvn -version

  build:
    commands:
      - mvn clean package -DskipTests
      - cp target/employee.jar employee.jar
      - test -f appspec.yml
      - test -f scripts/stop.sh
      - test -f scripts/start.sh

  post_build:
    commands:
      - echo "Build completed"
      - ls -lh employee.jar appspec.yml scripts/stop.sh scripts/start.sh

artifacts:
  files:
    - employee.jar
    - appspec.yml
    - scripts/stop.sh
    - scripts/start.sh
  discard-paths: no
